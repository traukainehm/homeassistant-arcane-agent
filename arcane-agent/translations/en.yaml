---
configuration:
  manager_api_url:
    name: Arcane Manager API URL
    description: >-
      Manager API URL provided by Arcane (for example http://192.168.1.10:3552)
  agent_token:
    name: Arcane Agent Token
    description: >-
      Token generated for this environment in Arcane
  mode:
    name: Agent mode
    description: >-
      direct listens on port 3553 for the manager to connect; edge polls the manager (no inbound port needed)
  environment:
    name: Environment
    description: >-
      Environment name (for example production)
  listen:
    name: Listen address
    description: >-
      Optional listen address for direct mode (for example 127.0.0.1)
