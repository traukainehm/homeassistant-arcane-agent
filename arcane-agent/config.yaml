name: "Arcane-Agent"
description: "Arcane-Agent for Home Assistant"
url: "https://github.com/traukainehm/homeassistant-arcane-agent"
version: "2.17.3"
slug: "arcane-agent"
init: false
stdin: true
docker_api: true
ports:
  3553/tcp: 3553
options:
  manager_api_url: ""
  agent_token: ""
  mode: direct
  environment: production
  listen: ""
schema:
  manager_api_url: str
  agent_token: password
  mode: list(direct|edge)
  environment: str?
  listen: str?
map:
  - type: app_config
    path: /app/data
    read_only: false
arch:
  - aarch64
  - amd64
